name = "lean4lean-model"
defaultTargets = ["Lean4LeanModel"]

# Mathlib is required first on purpose: lake resolves a shared transitive
# dependency (batteries) to the first pin it encounters, and mathlib's pin is
# the more constrained of the two.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0"

[[require]]
name = "lean4lean"
git = "https://github.com/digama0/lean4lean"
rev = "85b3796250ff028461f5e4588f5a53fd99d26173"

[[lean_lib]]
name = "Lean4LeanModel"
